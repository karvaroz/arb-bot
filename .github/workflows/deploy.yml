# Builds the Docker image (Rust binary + dashboard, see Dockerfile) and
# deploys it to the Oracle Cloud VM (IMPLEMENTATION_PLAN.md Phase 5
# deployment decision) — only on push to main, only after ci.yml's checks
# would pass (this workflow re-runs cargo test itself rather than depending
# on ci.yml's run, since cross-workflow `needs` can't span separate files).
#
# Required repo secrets:
#   SSH_HOST, SSH_USER, SSH_KEY — the Oracle VM's address + a deploy key
#   (the VM's own `.env`, with HELIUS_API_KEY/DOMAIN/BASIC_AUTH_*, stays on
#   the VM — never passed through CI).

name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - working-directory: apps/dashboard
        run: npm ci
      - working-directory: apps/dashboard
        run: npx tsc -b
      - working-directory: apps/dashboard
        run: npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # `.env` and docker-compose.yml/Caddyfile already live on the VM
          # (deployed once by hand — see IMPLEMENTATION_PLAN.md); this job
          # only ever pulls the new image and restarts the app service.
          script: |
            cd ~/arb-bot
            docker compose pull app
            docker compose up -d app
            docker image prune -f
